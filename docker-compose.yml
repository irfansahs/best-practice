# Profiles:
#   (none)  -> SQL Server only
#   hybrid  -> SQL + Vite UI (run API locally on :5202 for debugging)
#   full    -> SQL + API + production UI build
#
# Hybrid (UI in Docker, API local):
#   docker compose --profile hybrid up -d --build
#   dotnet run --project backend/src/Api --launch-profile http
#
# Full stack:
#   docker compose --profile full up -d --build

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: app-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    profiles: [full]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-api
    ports:
      - "5202:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: >-
        Server=sqlserver,1433;Database=BestPractice;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true;Connect Timeout=15
      Cors__AllowedOrigins__0: http://localhost:5173
      # Bearer auth: CORS origins for tooling / non-proxied UI; nginx same-origin preferred
      Cors__AllowedOrigins__1: http://127.0.0.1:5173
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    profiles: [full]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same origin via nginx /api proxy (see nginx.conf)
        VITE_API_URL: /api/v1
    container_name: app-frontend
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

  frontend-dev:
    profiles: [hybrid]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: app-frontend-dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api/v1
      VITE_PROXY_TARGET: http://host.docker.internal:5202
      CHOKIDAR_USEPOLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
  frontend-node-modules:
